<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        background: #f5f7fb;
        font-family: Arial, sans-serif;
        color: #222;
    }

    /* SIDEBAR */
    .sidebar {
        height: 100vh;
        width: 250px;
        position: fixed;
        left: 0;
        top: 0;
        background: #17191f;
        color: white;
        padding: 25px 18px;
    }

    .sidebar-logo {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 12px 30px;
        border-bottom: 1px solid #333;
        margin-bottom: 25px;
    }

    .sidebar-logo span {
        font-size: 30px;
    }

    .sidebar-logo h2 {
        font-size: 19px;
        margin: 0;
        font-weight: 700;
    }

    .sidebar-menu {
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .sidebar a {
        color: #aeb4c0;
        text-decoration: none;
        padding: 13px 15px;
        border-radius: 10px;
        font-size: 15px;
        transition: 0.2s;
    }

    .sidebar a:hover,
    .sidebar a.active {
        background: #292d36;
        color: white;
    }

    .sidebar a.active {
        border-left: 4px solid #ff6b35;
    }

    /* MAIN */
    .main-content {
        margin-left: 250px;
        padding: 30px 35px;
    }

    .top-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 28px;
    }

    .top-header h1 {
        font-size: 28px;
        font-weight: 700;
        margin: 0;
    }

    .subtitle {
        color: #888;
        font-size: 14px;
        margin-top: 5px;
    }

    /* LIVE */
    .live-indicator {
        display: flex;
        align-items: center;
        gap: 8px;
        background: white;
        padding: 9px 15px;
        border-radius: 20px;
        box-shadow: 0 3px 12px rgba(0,0,0,0.06);
        font-size: 14px;
        font-weight: 600;
    }

    .live-dot {
        width: 9px;
        height: 9px;
        background: #22c55e;
        border-radius: 50%;
        animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
        0% {
            opacity: 1;
        }

        50% {
            opacity: 0.4;
        }

        100% {
            opacity: 1;
        }
    }

    /* STAT CARDS */
    .stats-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
        margin-bottom: 28px;
    }

    .stat-card {
        background: white;
        border-radius: 15px;
        padding: 22px;
        box-shadow: 0 5px 18px rgba(0,0,0,0.06);
        display: flex;
        align-items: center;
        gap: 17px;
    }

    .stat-icon {
        width: 52px;
        height: 52px;
        border-radius: 13px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
    }

    .orders-icon {
        background: #fff0e9;
    }

    .revenue-icon {
        background: #eaf8ef;
    }

    .menu-icon {
        background: #eef4ff;
    }

    .stat-label {
        color: #777;
        font-size: 13px;
        margin-bottom: 4px;
    }

    .stat-value {
        font-size: 25px;
        font-weight: 700;
    }

    /* ORDERS SECTION */
    .orders-section {
        background: white;
        border-radius: 16px;
        padding: 25px;
        box-shadow: 0 5px 18px rgba(0,0,0,0.06);
    }

    .orders-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
    }

    .orders-header h3 {
        margin: 0;
        font-size: 20px;
        font-weight: 700;
    }

    .refresh-text {
        font-size: 12px;
        color: #888;
    }

    /* ORDER CARD */
    .order-box {
        background: #fafbfc;
        border: 1px solid #e5e7eb;
        border-radius: 14px;
        padding: 20px;
        margin-bottom: 16px;
        transition: 0.2s;
        border-left: 5px solid #ffb703;
    }

    .order-box:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 18px rgba(0,0,0,0.08);
    }

    .order-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 15px;
        margin-bottom: 18px;
    }

    .order-number {
        font-size: 18px;
        font-weight: 700;
    }

    .customer-name {
        color: #666;
        font-size: 14px;
        margin-top: 4px;
    }

    /* STATUS */
    .status-badge {
        padding: 7px 13px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: 700;
        white-space: nowrap;
    }

    .status-confirmed {
        background: #fff3cd;
        color: #946c00;
    }

    .status-accepted {
        background: #e7f0ff;
        color: #1456b8;
    }

    .status-preparing {
        background: #fff0d9;
        color: #b45f00;
    }

    .status-ready {
        background: #dff7fb;
        color: #087b8a;
    }

    .status-completed {
        background: #e3f7e9;
        color: #18733a;
    }

    /* DETAILS */
    .order-details {
        display: grid;
        grid-template-columns: 1.5fr 1fr;
        gap: 15px;
        margin-bottom: 18px;
    }

    .detail-box {
        background: white;
        border: 1px solid #eceef1;
        border-radius: 10px;
        padding: 15px;
    }

    .detail-label {
        display: block;
        font-size: 11px;
        color: #888;
        margin-bottom: 10px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        font-weight: 700;
    }

    .detail-value {
        font-size: 13px;
        font-weight: 600;
        color: #333;
        line-height: 1.5;
    }

    /* FOOD LIST */
    .food-list {
        margin-top: 5px;
    }

    .food-item {
        display: grid;
        grid-template-columns: 1fr auto auto auto;
        align-items: center;
        gap: 12px;
        background: #f8f9fa;
        border: 1px solid #eceef1;
        border-radius: 8px;
        padding: 10px 12px;
        margin-bottom: 7px;
        font-size: 13px;
    }

    .food-name {
        font-weight: 700;
        color: #333;
    }

    .food-quantity {
        background: #eef4ff;
        color: #1456b8;
        padding: 4px 8px;
        border-radius: 12px;
        font-size: 11px;
        font-weight: 700;
        white-space: nowrap;
    }

    .food-price {
        color: #666;
        white-space: nowrap;
    }

    .food-subtotal {
        color: #e85d04;
        font-weight: 700;
        white-space: nowrap;
    }

    .food-header {
        display: grid;
        grid-template-columns: 1fr auto auto auto;
        gap: 12px;
        padding: 0 12px 6px;
        color: #999;
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
    }

    /* TOTAL ITEMS */
    .total-items {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 12px;
        padding-top: 12px;
        border-top: 1px solid #e5e7eb;
        font-size: 13px;
        color: #555;
    }

    .total-items strong {
        background: #fff0e9;
        color: #e85d04;
        padding: 5px 11px;
        border-radius: 15px;
        font-size: 13px;
    }

    /* CUSTOMER INFORMATION */
    .customer-info {
        margin-bottom: 12px;
        padding: 10px;
        background: #f8f9fa;
        border-radius: 8px;
        font-size: 13px;
    }

    .customer-extra {
        margin-top: 12px;
        padding-top: 11px;
        border-top: 1px solid #eee;
        color: #666;
        font-size: 13px;
    }

    /* ORDER FOOTER */
    .order-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 15px;
    }

    .order-total-section {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
    }

    .total-price {
        font-size: 21px;
        font-weight: 700;
        color: #e85d04;
    }

    .payment {
        font-size: 12px;
        color: #777;
        background: #f1f3f5;
        padding: 5px 9px;
        border-radius: 12px;
    }

    /* BUTTONS */
    .status-buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
    }

    .status-btn {
        border: none;
        border-radius: 7px;
        padding: 9px 13px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        transition: 0.2s;
    }

    .status-btn:hover {
        transform: translateY(-1px);
        opacity: 0.9;
    }

    .btn-accept {
        background: #2563eb;
        color: white;
    }

    .btn-preparing {
        background: #f59e0b;
        color: white;
    }

    .btn-ready {
        background: #0891b2;
        color: white;
    }

    .btn-complete {
        background: #16a34a;
        color: white;
    }

    /* EMPTY */
    .empty-orders {
        text-align: center;
        padding: 45px 20px;
        color: #888;
    }

    .empty-orders .empty-icon {
        font-size: 42px;
        margin-bottom: 10px;
    }

    /* MOBILE */
    @media (max-width: 900px) {

        .sidebar {
            width: 200px;
        }

        .main-content {
            margin-left: 200px;
        }

        .stats-grid {
            grid-template-columns: 1fr;
        }

        .order-details {
            grid-template-columns: 1fr;

        }

        }
    }

</div>

<script>


/* ================= START ================= */

window.onload = function() {

    loadDashboardData();

    setInterval(
        loadDashboardData,
        4000
    );

};



/* ================= LOAD ORDERS ================= */

async function loadDashboardData() {

    try {

        let response =
            await fetch('/api/orders');


        if (!response.ok) {

            console.error(
                'Failed to load orders'
            );

            return;

        }


        let orders =
            await response.json();


        /* TOTAL ORDERS */

        document.getElementById(
            'orders-count'
        ).innerText =
            orders.length;



        /* TOTAL REVENUE */

        let totalValue =
            orders.reduce(
                (sum, order) =>
                    sum + (Number(order.total) || 0),
                0
            );


        document.getElementById(
            'order-value'
        ).innerText =
            totalValue.toFixed(0);



        /* ORDER CONTAINER */

        let container =
            document.getElementById(
                'live-orders-container'
            );


        container.innerHTML = '';



        /* NO ORDERS */

        if (orders.length === 0) {

            container.innerHTML = `

                <div class="empty-orders">

                    <div class="empty-icon">
                        🍽️
                    </div>

                    <div>
                        No customer orders yet.
                    </div>

                    <small>
                        New orders will appear here automatically.
                    </small>

                </div>

            `;

            return;

        }



        /* DISPLAY ORDERS */

        orders.forEach(order => {


            let status =
                order.status || 'CONFIRMED';


            let statusClass =
                'status-confirmed';


            if (status === 'ACCEPTED') {

                statusClass =
                    'status-accepted';

            }

            else if (status === 'PREPARING') {

                statusClass =
                    'status-preparing';

            }

            else if (status === 'READY') {

                statusClass =
                    'status-ready';

            }

            else if (status === 'COMPLETED') {

                statusClass =
                    'status-completed';

            }



            /* ================= FOOD ITEMS ================= */

            let foodItems =
                order.foodItems || 'No items';


            let foodItemsHTML = '';


            foodItems
                .split(', ')
                .forEach(item => {

                    /*
                     Expected format:

                     Biryani x 2 @ ₹220 = ₹440
                    */

                    let match =
                        item.match(
                            /^(.+?)\s+x\s+(\d+)\s+@\s+₹([\d.]+)\s+=\s+₹([\d.]+)$/
                        );


                    if (match) {

                        let name =
                            match[1];

                        let quantity =
                            match[2];

                        let price =
                            match[3];

                        let subtotal =
                            match[4];


                        foodItemsHTML += `

                            <div class="food-item">

                                <span class="food-name">
                                    🍽️ ${name}
                                </span>

                                <span class="food-quantity">
                                    Qty: ${quantity}
                                </span>

                                <span class="food-price">
                                    ₹${price}
                                </span>

                                <span class="food-subtotal">
                                    ₹${subtotal}
                                </span>

                            </div>

                        `;

                    }

                    else {

                        /*
                         Handles old orders that were
                         saved before the price format
                         was added.
                        */

                        foodItemsHTML += `

                            <div class="food-item">

                                <span class="food-name">
                                    🍽️ ${item}
                                </span>

                            </div>

                        `;

                    }

                });



            /* ================= ORDER CARD ================= */

            container.innerHTML += `

                <div class="order-box">


                    <!-- ORDER HEADER -->

                    <div class="order-top">

                        <div>

                            <div class="order-number">

                                Order #${order.id}

                            </div>


                            <div class="customer-name">

                                👤
                                ${order.customerName || 'Customer'}

                                &nbsp; • &nbsp;

                                📞
                                ${order.phoneNumber || 'N/A'}

                            </div>

                        </div>


                        <span
                            class="status-badge ${statusClass}">

                            ${status}

                        </span>

                    </div>



                    <!-- ORDER DETAILS -->

                    <div class="order-details">


                        <!-- FOOD ITEMS -->

                        <div class="detail-box">

                            <span class="detail-label">

                                🍴 Food Items

                            </span>


                            <div class="food-header">

                                <span>Item</span>
                                <span>Quantity</span>
                                <span>Price</span>
                                <span>Subtotal</span>

                            </div>


                            <div class="food-list">

                                ${foodItemsHTML}

                            </div>


                            <div class="total-items">

                                <span>
                                    🛒 Total Food Items
                                </span>

                                <strong>
                                    ${order.items || 0}
                                </strong>

                            </div>

                        </div>



                        <!-- CUSTOMER DETAILS -->

                        <div class="detail-box">

                            <span class="detail-label">

                                📍 Customer Details

                            </span>


                            <div class="customer-info">

                                👤
                                <strong>
                                    ${order.customerName || 'Customer'}
                                </strong>

                            </div>


                            <div class="detail-value">

                                📍
                                ${order.deliveryAddress || 'N/A'}

                            </div>


                            <div class="customer-extra">

                                📞
                                ${order.phoneNumber || 'N/A'}

                            </div>


                            <div class="customer-extra">

                                💳 Payment:
                                ${order.paymentMethod || 'COD'}

                            </div>

                        </div>


                    </div>



                    <!-- ORDER FOOTER -->

                    <div class="order-footer">


                        <div class="order-total-section">

                            <span class="total-price">

                                ₹${Number(order.total || 0).toFixed(0)}

                            </span>


                            <span class="payment">

                                Total Order Amount

                            </span>

                        </div>



                        <!-- STATUS BUTTONS -->

                        <div class="status-buttons">


                            <button
                                class="status-btn btn-accept"
                                onclick="updateStatus(${order.id}, 'ACCEPTED')">

                                ✓ Accept

                            </button>


                            <button
                                class="status-btn btn-preparing"
                                onclick="updateStatus(${order.id}, 'PREPARING')">

                                🔥 Start Preparing

                            </button>


                            <button
                                class="status-btn btn-ready"
                                onclick="updateStatus(${order.id}, 'READY')">

                                ✓ Food Prepared

                            </button>


                            <button
                                class="status-btn btn-complete"
                                onclick="updateStatus(${order.id}, 'COMPLETED')">

                                ✓ Complete

                            </button>


                        </div>

                    </div>


                </div>

            `;

        });


    }

    catch (err) {

        console.error(
            'Error loading dashboard data:',
            err
        );

    }

}



/* ================= UPDATE STATUS ================= */

async function updateStatus(
    orderId,
    newStatus
) {

    try {

        let response =
            await fetch(
                `/api/orders/${orderId}/status?status=${newStatus}`,
                {
                    method: 'PUT'
                }
            );


        if (response.ok) {

            loadDashboardData();

        }

        else {

            alert(
                'Failed to update status.'
            );

        }

    }

    catch (err) {

        console.error(
            'Error updating status:',
            err
        );

        alert(
            'Error updating order status.'
        );

    }

}

</script>
